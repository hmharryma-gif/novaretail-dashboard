<line x1="280" x2="1368" y1="399" y2="399" stroke="#DCE1DB"/><line x1="280" x2="360" y1="399" y2="399" stroke="#087F75" stroke-width="3"/>
<text x="280" y="437" class="heading">Revenue by segment</text>
<text x="280" y="480" class="small">Growth</text><rect x="380" y="462" width="254" height="25" rx="3" fill="#087F75"/><text x="644" y="480" class="small">$6,630</text>
<text x="280" y="524" class="small">Promising</text><rect x="380" y="506" width="207" height="25" rx="3" fill="#3479B4"/><text x="597" y="524" class="small">$5,395</text>
<text x="280" y="568" class="small">Decline</text><rect x="380" y="550" width="140" height="25" rx="3" fill="#BF4B45"/><text x="530" y="568" class="small">$3,650</text>
<text x="280" y="612" class="small">Stable</text><rect x="380" y="594" width="40" height="25" rx="3" fill="#8C7C54"/><text x="430" y="612" class="small">$1,045</text>
<text x="280" y="656" class="small">Unknown</text><rect x="380" y="638" width="10" height="25" rx="3" fill="#77838C"/><text x="400" y="656" class="small">$250</text>
<text x="735" y="437" class="heading">Daily recorded revenue</text>
<rect x="735" y="459" width="633" height="211" rx="9" fill="white" stroke="#DCE1DB" stroke-dasharray="6 5"/>
<text x="765" y="508" class="label">Interactive date chart</text><text x="765" y="544" class="small muted">X: selected record dates</text><text x="765" y="574" class="small muted">Y: sum of recorded amounts in USD</text><text x="765" y="614" class="small muted">Short sampled history; no forecast or churn inference.</text>
<text x="280" y="710" class="heading">Decisions to explore</text>
<g fill="white" stroke="#DCE1DB"><rect x="280" y="727" width="350" height="92" rx="9"/><rect x="649" y="727" width="350" height="92" rx="9"/><rect x="1018" y="727" width="350" height="92" rx="9"/></g>
<text x="296" y="755" class="label" font-weight="700">Develop existing demand</text><text x="296" y="782" class="small muted">Growth + Promising: 70.9% of revenue.</text><text x="296" y="804" class="small muted">Test a focused follow-up campaign.</text>
<text x="665" y="755" class="label" font-weight="700">Prioritize service recovery</text><text x="665" y="782" class="small muted">Inspect low-rated and Decline records.</text><text x="665" y="804" class="small muted">Verify customer identity before outreach.</text>
<text x="1034" y="755" class="label" font-weight="700">Test the leading category</text><text x="1034" y="782" class="small muted">Electronics: $7,089.84 from 16 records.</text><text x="1034" y="804" class="small muted">Measure incremental spend and margin.</text>
<text x="280" y="862" class="heading">Highest recorded spend by customer ID</text><text x="280" y="891" class="small muted">Sortable table: ID, revenue, share, records, latest segment, satisfaction, review reasons.</text>
<line x1="280" x2="1368" y1="914" y2="914" stroke="#DCE1DB"/>
<text x="280" y="942" class="small muted">DESIGN SKETCH · Overview page · Other tabs retain the sidebar and KPI cards.</text>
